name: sonde
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          Q='[out:json][timeout:20];(node(around:3000,45.25302,4.66528)["amenity"="toilets"]["access"!~"^(private|no)$"];way(around:3000,45.25302,4.66528)["amenity"="toilets"]["access"!~"^(private|no)$"];node(around:3000,45.25302,4.66528)["amenity"="fuel"]["toilets"="yes"];way(around:3000,45.25302,4.66528)["amenity"="fuel"]["toilets"="yes"];node(around:3000,45.25302,4.66528)["highway"~"^(services|rest_area)$"]["toilets"="yes"];way(around:3000,45.25302,4.66528)["highway"~"^(services|rest_area)$"]["toilets"="yes"];);out center tags 80;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== $ep"; curl -s -m 25 -w "\nHTTP %{http_code} %{time_total}s\n" -A "HorizonNav/1.0 (Android navigation app)" --data-urlencode "data=$Q" "$ep" | head -c 1500; echo
          done
