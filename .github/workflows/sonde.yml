name: sonde
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          Q='[out:json][timeout:25];(node["highway"="street_lamp"](45.24,4.56,45.32,4.68);way["highway"]["lit"~"^(yes|no)$"](45.24,4.56,45.32,4.68););out count;'
          for ua in "HorizonNav/1.0 (Android navigation app)" "HorizonNavFR/1.0 (+https://github.com/ASSE03/Horizon-Maps)"; do
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== $ua $ep"; /usr/bin/time -f "%es" curl -s -m 40 -A "$ua" -o o.json -w "%{http_code}\n" --data-urlencode "data=$Q" $ep; head -c 300 o.json | tr '\n' ' '; echo
          done
          done
