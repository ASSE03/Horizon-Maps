name: sonde
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          Q='[out:json][timeout:120];area["ISO3166-1"="FR"][admin_level=2]->.fr;node(area.fr)["highway"="speed_camera"];out tags;'
          curl -s -m 150 --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter > o.json
          python3 -c "
          import json,collections
          d=json.load(open('o.json'))['elements']; c=collections.Counter(); n=0
          for e in d:
            t=e.get('tags',{}); v=t.get('direction')
            if v is None: c['(aucune)']+=1
            elif v.replace('.','').isdigit(): c['angle']+=1
            elif ';' in v: c['deux angles']+=1
            else: c[v]+=1
          print(len(d)); print(c.most_common(20))"
