name: sonde
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HorizonNavFR/1.0"
          echo "== viaduc"; curl -s -m 20 -A "$UA" "https://nominatim.openstreetmap.org/search?q=Viaduc+Daniel+Aim%C3%A9+Annonay&format=jsonv2&limit=2" | head -c 400; echo
          for P in "45.26240,4.70720" "45.24700,4.66900"; do
          Q="[out:json][timeout:60];way(around:150,$P)[highway~\"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential)(_link)?$\"];out tags center;"
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "== $P $ep"; curl -s -m 70 -A "$UA" --data-urlencode "data=$Q" "$ep" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            for e in d['elements']:
              t=e.get('tags',{}); c=e.get('center',{})
              print(e['id'],t.get('highway'),t.get('junction',''),t.get('name'),t.get('ref'),'max=',t.get('maxspeed'),'zone=',t.get('zone:maxspeed'),t.get('maxspeed:type'),'bridge=',t.get('bridge',''), round(c.get('lat',0),5),round(c.get('lon',0),5))
            sys.exit(0)
          except Exception as ex: print('err',ex); sys.exit(1)
          " && break
          done; done
