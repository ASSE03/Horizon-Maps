name: sonde
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HorizonNav/1.0 (Android navigation app)"
          echo "== nominatim"; curl -s -m 20 -A "$UA" "https://nominatim.openstreetmap.org/search?amenity=toilets&viewbox=4.62,45.28,4.71,45.22&bounded=1&format=jsonv2&limit=40&extratags=1" | head -c 2500; echo
          echo "== photon"; curl -s -m 20 -A "$UA" "https://photon.komoot.io/reverse?lat=45.25302&lon=4.66528&radius=5&osm_tag=amenity:toilets&limit=20" | head -c 2500; echo
          echo "== photon q"; curl -s -m 20 -A "$UA" "https://photon.komoot.io/api/?q=toilettes&lat=45.25302&lon=4.66528&osm_tag=amenity:toilets&limit=20&location_bias_scale=0.1" | head -c 2500; echo
          echo "== overpass status"; curl -s -m 15 https://overpass-api.de/api/status | head -20
