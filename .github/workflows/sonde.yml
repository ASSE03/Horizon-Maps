name: sonde
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="HorizonNavFR/1.0"
          echo "== rev"; curl -s -m 20 -A "$UA" "https://nominatim.openstreetmap.org/reverse?lat=45.29938&lon=4.58626&format=jsonv2&zoom=17" | head -c 700; echo
          Q='[out:json][timeout:60];way(around:120,45.29938,4.58626)[highway];out tags geom;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            echo "== $ep"; r=$(curl -s -m 70 -A "$UA" --data-urlencode "data=$Q" "$ep"); echo "$r" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            for e in d['elements']:
              t=e.get('tags',{}); g=e.get('geometry',[])
              print(e['id'],t.get('highway'),t.get('name'),t.get('ref'),'maxspeed=',t.get('maxspeed'),t.get('maxspeed:forward'),t.get('maxspeed:backward'),'zone=',t.get('zone:maxspeed'),t.get('source:maxspeed'), len(g), g[0] if g else '', g[-1] if g else '')
            sys.exit(0)
          except Exception as ex: print('err',ex)
          " && break
          done
