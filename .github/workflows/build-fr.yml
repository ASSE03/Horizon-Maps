name: Build Horizon Nav FR

# Builds the French version straight from the sources in this repository (the original workflow built from HorizonNav.zip).
# Every push to main that touches the app builds the APK and publishes it on the "app" release (the in-app updater finds it). Run it by hand with
# "publish" ticked to put it on the "app" release, where the app's built-in updater looks for new versions.
# (fork FR : relancé si GitHub refuse la création de la release, ou si la compilation reste en attente sur GitHub)
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "CHANGELOG.fr.md"
      - "tools/notes_fr.py"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-fr.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publier l'APK sur la release « app » (pour la mise à jour intégrée)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept the Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 manquant : Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/signing.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/signing.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "Signing key restored."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4

      - name: Release notes (CHANGELOG.fr.md, or the commits since the last published version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force -q || true
          PREV="$(git tag -l 'v1.0.*' --sort=-v:refname | head -n1)"
          # les notes des versions déjà publiées, pour ne pas répéter une ligne du changelog
          : > "$RUNNER_TEMP/old.md"
          for t in $(git tag -l 'v1.0.*' --sort=-v:refname | head -n 12); do
            gh release view "$t" --repo "${{ github.repository }}" --json body -q .body >> "$RUNNER_TEMP/old.md" 2>/dev/null || true
            echo >> "$RUNNER_TEMP/old.md"
          done
          python3 tools/notes_fr.py CHANGELOG.fr.md "$RUNNER_TEMP/old.md" > "$RUNNER_TEMP/notes.md" || true
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-15"; fi
            git log $RANGE --first-parent --format='- %s' | grep -v -i -E 'skip ci|^- Merge |Add files via upload|Sync Horizon Nav source' > "$RUNNER_TEMP/notes.md" || true
          fi
          [ -s "$RUNNER_TEMP/notes.md" ] || printf -- "- Petites améliorations\n" > "$RUNNER_TEMP/notes.md"
          mkdir -p app/src/main/assets
          cp "$RUNNER_TEMP/notes.md" app/src/main/assets/whatsnew.md
          echo "Notes:"; cat "$RUNNER_TEMP/notes.md"

      - name: Build release APK
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: gradle :app:assembleRelease

      - name: Run unit tests
        run: gradle :app:testPublicReleaseUnitTest || echo "::warning::Some unit tests failed"

      - uses: actions/upload-artifact@v4
        with:
          name: HorizonNav-FR-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish the app
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/HorizonNav-public.apk"
          BUILD="${GITHUB_RUN_NUMBER}"
          VERSION="1.0.${BUILD}"
          VERSION_CODE=$((100 + BUILD))
          sha256sum "$APK" | awk '{print $1}' > HorizonNav-public.apk.sha256
          printf '{\n  "version": "%s",\n  "build": %s,\n  "versionCode": %s\n}\n' "$VERSION" "$BUILD" "$VERSION_CODE" > version.json
          cp "$RUNNER_TEMP/notes.md" release-notes.md
          # one release per version (v1.0.N, its notes = the commits since the previous one), so the What's new card can gather
          # the changes of every version skipped; then the stable "app" release the updater reads
          # (relancé après une erreur de GitHub : la version existe déjà, ses fichiers sont remplacés)
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --repo "${{ github.repository }}" --notes-file release-notes.md
            gh release upload "v${VERSION}" "$APK" HorizonNav-public.apk.sha256 version.json --repo "${{ github.repository }}" --clobber
          else
            gh release create "v${VERSION}" "$APK" HorizonNav-public.apk.sha256 version.json --repo "${{ github.repository }}" \
              --title "Horizon Nav FR ${VERSION}" --notes-file release-notes.md --target "${GITHUB_SHA}" --latest=false
          fi
          if gh release view app --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit app --repo "${{ github.repository }}" --title "Horizon Nav FR (${VERSION})" --notes-file release-notes.md
          else
            gh release create app --repo "${{ github.repository }}" --title "Horizon Nav FR (${VERSION})" --notes-file release-notes.md
          fi
          gh release upload app "$APK" HorizonNav-public.apk.sha256 version.json --repo "${{ github.repository }}" --clobber
          echo "Lien de téléchargement : https://github.com/${{ github.repository }}/releases/download/app/HorizonNav-public.apk"
          # seules les 10 dernières versions (v1.0.N) sont gardées ; la release « app » reste toujours
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -t. -k3,3nr | tail -n +11 \
            | while read -r t; do gh release delete "$t" --repo "${{ github.repository }}" --yes --cleanup-tag || true; done
