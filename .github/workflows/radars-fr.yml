name: Radars France
on:
  schedule:
    - cron: "17 3 * * *"
  # pas de relance à chaque modification : le quota Lufop (200 requêtes/jour) ne permet qu'un passage par jour
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radars:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Construire radars_fr.json
        env:
          LUFOP_KEY: ${{ secrets.LUFOP_KEY }}
        run: python3 tools/radars_fr.py
      - name: Publier dans la release « radars »
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view radars >/dev/null 2>&1 || gh release create radars --title "Radars France (données)" --notes "Fichier des radars fixes de France pour Horizon Nav FR, mis à jour chaque jour (liste officielle du ministère de l'Intérieur, directions Lufop CC BY-SA 4.0 et OpenStreetMap)." --latest=false
          gh release upload radars radars_fr.json --clobber
          if [ -f lufop_cache.json ]; then gh release upload radars lufop_cache.json --clobber; fi
